services:
  panel:
    command:
      - github-archive-panel
      - -docker
      - -listen
      - 0.0.0.0:8765
      - -config
      - /workspace/config.yaml
      - -trusted-origin
      - https://${ARCHIVE_DOMAIN:?Set ARCHIVE_DOMAIN to your public DNS name}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ARCHIVE_DOMAIN: ${ARCHIVE_DOMAIN:?Set ARCHIVE_DOMAIN to your public DNS name}
      ARCHIVE_USERNAME: ${ARCHIVE_USERNAME:?Set ARCHIVE_USERNAME}
      ARCHIVE_PASSWORD_HASH: ${ARCHIVE_PASSWORD_HASH:?Set ARCHIVE_PASSWORD_HASH to a bcrypt hash}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [panel_net]

volumes:
  caddy_data:
  caddy_config:
